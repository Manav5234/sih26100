[project]
name = "sih26100-backend"
version = "0.1.0"
description = "SIH26100 Platform Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "alembic==1.13.3",
    "bcrypt==4.2.0",
    "PyJWT==2.9.0",
    "numpy>=1.26.0",
    "pdfplumber==0.11.10",
    "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]
ocr = [
    "opencv-python-headless==4.10.0.84",
    "rapidocr-onnxruntime>=1.4.0,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/auth.py" = ["B008"]
"app/tender_extraction.py" = ["S310"]
