# Development override — use this for iterative frontend development.
#
# Usage:
#   docker compose up          (production build — needs --build after every code change)
#   docker compose watch       (dev mode — auto-rebuilds on file changes)
#   docker compose up -d       (detached production build)
#
# This override file is automatically loaded by `docker compose up` and
# `docker compose watch`. It mounts the frontend source into the container
# and runs Next.js dev server instead of the production build.
#
# To use the production build (frozen image) instead, run:
#   docker compose -f docker-compose.yml up --build

services:
  frontend:
    build:
      context: ./frontend
      target: deps
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/package.json:/app/package.json
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
