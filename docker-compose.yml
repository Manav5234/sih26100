services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih26100
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih26100"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sih26100
      JWT_SECRET: ${JWT_SECRET:-sih26100-dev-secret-change-in-production}
    depends_on:
      postgres:
        # entrypoint.sh runs `alembic upgrade head` at boot; wait for postgres
        # to accept connections first or the backend exits on a fresh volume.
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}

volumes:
  pgdata:
  uploads:
